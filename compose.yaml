services:
  minecraft:
    build:
      context: .
    image: seedserver:26.3-folia
    container_name: seedserver
    restart: unless-stopped
    init: true
    ports:
      - "25566:25566/tcp"
    environment:
      EULA: "${EULA:-FALSE}"
      TYPE: FOLIA
      VERSION: "26.3"
      FOLIA_CHANNEL: default
      SERVER_PORT: "25566"
      LEVEL: seedserver
      ONLINE_MODE: "${ONLINE_MODE:-TRUE}"
      MEMORY: "${MEMORY:-4G}"
      MODE: creative
      FORCE_GAMEMODE: "true"
      MAX_PLAYERS: "${MAX_PLAYERS:-20}"
      DIFFICULTY: normal
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "32"
      SIMULATION_DISTANCE: "8"
      ENABLE_RCON: "false"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
