# Сколько следующих миров заранее создавать и держать в очереди.
warm-worlds: 2

# Радиус предварительной генерации вокруг спавна, в чанках.
# 4 означает квадрат 9x9 чанков (144x144 блока).
pregeneration-radius-chunks: 4

# Сколько чанков генерировать за один серверный тик.
# Увеличение ускоряет подготовку, но может добавить нагрузку на сервер.
chunks-per-tick: 1
